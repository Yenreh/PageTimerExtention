<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="popupTitle">Page Timer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="header-content">
          <svg
            class="logo"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="2"
            />
            <path
              d="M12 6V12L16 14"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <h1 class="title" data-i18n="headerTitle">Page Timer</h1>
        </div>
      </header>

      <!-- Current URL -->
      <div class="url-bar">
        <span id="currentUrl" class="url-text" data-i18n="urlLoading">Loading...</span>
      </div>

      <!-- Site Toggle -->
      <div class="toggle-bar" id="toggleBar">
        <span class="toggle-label" data-i18n="toggleLabel">Measure this page</span>
        <label class="switch">
          <input type="checkbox" id="enableToggle" />
          <span class="slider"></span>
        </label>
      </div>

      <!-- Info text -->
      <p class="info-text" data-i18n="infoText">All times are in milliseconds</p>

      <!-- Metrics Table -->
      <div class="table-container">
        <table class="metrics-table">
          <thead>
            <tr>
              <th data-i18n="colEvent">Event</th>
              <th data-i18n="colStart">Start</th>
              <th data-i18n="colDuration">Duration</th>
              <th data-i18n="colEnd">End</th>
            </tr>
          </thead>
          <tbody id="metricsBody">
            <!-- Las filas se generan dinámicamente -->
          </tbody>
        </table>
      </div>

      <!-- Total Row -->
      <div class="total-row" id="totalRow">
        <span class="total-label" data-i18n="totalLabel">Total</span>
        <span class="total-value" id="totalValue">--</span>
      </div>

      <!-- No Data Message -->
      <div class="no-data" id="noData" style="display: none">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="M12 8V12"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
          <circle cx="12" cy="16" r="1" fill="currentColor" />
        </svg>
        <p data-i18n="noDataTitle">No metrics data available.</p>
        <p class="hint" data-i18n="noDataHint">Navigate to a page to see its load times.</p>
      </div>

      <!-- Action Buttons -->
      <div class="actions">
        <button class="action-btn" id="downloadBtn" title="Download data" data-i18n-title="btnDownloadTitle">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M21 15V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V15"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M7 10L12 15L17 10"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M12 15V3"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span data-i18n="btnDownload">Download</span>
        </button>
        <button class="action-btn" id="clearBtn" title="Clear data" data-i18n-title="btnClearTitle">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M3 6H5H21"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6H19Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span data-i18n="btnClear">Clear</span>
        </button>
        <button class="action-btn" id="refreshBtn" title="Refresh metrics" data-i18n-title="btnRefreshTitle">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M23 4V10H17"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M1 20V14H7"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M3.51 9C4.01717 7.56678 4.87913 6.2854 6.01547 5.27542C7.15182 4.26543 8.52547 3.55976 10.0083 3.22426C11.4911 2.88875 13.0348 2.93434 14.4952 3.35677C15.9556 3.77921 17.2853 4.56471 18.36 5.64L23 10M1 14L5.64 18.36C6.71475 19.4353 8.04437 20.2208 9.50481 20.6432C10.9652 21.0657 12.5089 21.1112 13.9917 20.7757C15.4745 20.4402 16.8482 19.7346 17.9845 18.7246C19.1209 17.7146 19.9828 16.4332 20.49 15"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span data-i18n="btnRefresh">Refresh</span>
        </button>
      </div>

      <!-- Footer -->
      <div class="footer">
        <a
          class="footer-link"
          href="https://github.com/Yenreh/PageTimerExtention"
          target="_blank"
          rel="noreferrer"
          title="github.com/Yenreh"
        >
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.203 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.194 22 16.442 22 12.017 22 6.484 17.523 2 12 2z" fill="currentColor" />
          </svg>
          <span>by Yenreh</span>
        </a>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
