name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: find src -name "*.json" -print0 | xargs -0 -n1 jq empty

      - name: Read version from manifest
        id: version
        run: echo "version=$(jq -r .version src/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Package extensions
        run: ./build.sh --zip

      - name: Lint Firefox package
        run: npx --yes web-ext@8 lint --source-dir dist/firefox

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
